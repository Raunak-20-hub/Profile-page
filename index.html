
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Kira | Death Note Profile</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">

    <!-- JavaScript File -->
    <script src="script.js" defer></script>
</head>

<body>

    <!-- Background Decoration -->
    <div class="background-portrait">
        <img src="kira-avatar.png" alt="">
    </div>

    <div class="death-note-title">
        DEATH<br>NOTE
        <div class="apple">🍎</div>
    </div>


    <!-- Main Container -->
    <main class="container">

        <!-- Theme Buttons -->
        <div class="theme-buttons">

            <button class="theme-btn light-btn"
                    onclick="setLight()">

                <span class="theme-icon">☀️</span>
                Light

            </button>

            <button class="theme-btn dark-btn"
                    onclick="setDark()">

                <span class="theme-icon">🌙</span>
                Dark

            </button>

        </div>


        <!-- Profile Card -->
        <section class="profile-card">

            <!-- Profile Image -->
            <div class="profile-image">

                <img src="kira-avatar.png"
                     alt="Kira - Light Yagami">

            </div>


            <!-- Profile Details -->
            <div class="profile-info">

                <h1>Kira</h1>

                <div class="red-line"></div>

                <p>
                    Just a normal student...
                    <br>
                    with an extraordinary plan.
                </p>

                <h3>
                    Death Note |
                    <span>Light Yagami</span>
                </h3>


                <!-- Contact Button -->
                <a href="mailto:yourmail@example.com"
                   class="contact-button">

                    <img
                    src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/envelope-fill.svg"
                    alt="Email">

                    Get in touch

                </a>

            </div>


            <!-- Social Media Buttons -->
            <div class="social-links">

                <!-- Instagram -->
                <a href="https://www.instagram.com/"
                   target="_blank"
                   rel="noopener noreferrer"
                   class="social-icon instagram"
                   aria-label="Instagram">

                    <img
                    src="https://cdn.simpleicons.org/instagram/FFFFFF"
                    alt="Instagram">

                </a>


                <!-- X -->
                <a href="https://x.com/"
                   target="_blank"
                   rel="noopener noreferrer"
                   class="social-icon"
                   aria-label="X">

                    <img
                    src="https://cdn.simpleicons.org/x/FFFFFF"
                    alt="X">

                </a>


                <!-- Email -->
                <a href="mailto:yourmail@example.com"
                   class="social-icon"
                   aria-label="Email">

                    <img
                    src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/envelope.svg"
                    alt="Email">

                </a>


                <!-- Website -->
                <a href="https://www.google.com/"
                   target="_blank"
                   rel="noopener noreferrer"
                   class="social-icon"
                   aria-label="Website">

                    <img
                    src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/globe.svg"
                    alt="Website">

                </a>

            </div>

        </section>

    </main>

</body>
</html>
